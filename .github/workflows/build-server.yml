name: Build server tarball

on:
  workflow_dispatch:

jobs:
  build:
    # macos-15 is our minimum: the first macOS on M4.
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Build
        run: ./build_server.sh
      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: dist/*
          if-no-files-found: error
