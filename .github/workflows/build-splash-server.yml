name: Build MLX and Splash Nightly preview
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15 # Build only; native inference requires macOS 26.4+.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Build pinned offline bundle
        run: uv run --python 3.13 packaging/build_splash.py --output dist/junie-local-splash-preview-macos-arm64.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: junie-local-splash-preview-macos-arm64
          path: dist/junie-local-splash-preview-macos-arm64.tar.gz
          if-no-files-found: error
